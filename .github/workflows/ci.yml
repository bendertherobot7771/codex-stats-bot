name: CI and Windows agent build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q agent server tests

  build-windows-agent:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - name: Build single-file executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name codex-stats-agent
          agent/entrypoint.py
      - name: Smoke-test executable
        run: .\dist\codex-stats-agent.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: codex-stats-agent-windows-x64
          path: dist/codex-stats-agent.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: codex-stats-agent-windows-x64
          path: dist
      - name: Sign release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python -m scripts.package_release
      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-stats-agent.exe
            dist/server.tar.gz
            dist/release.json
            dist/agent-source.zip
          generate_release_notes: true
