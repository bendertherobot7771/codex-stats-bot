# Installed inside nginx's http context. Dedicated port; no Nextcloud country map.
limit_req_zone $binary_remote_addr zone=codex_stats_requests:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=codex_stats_enrollment:1m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=codex_stats_connections:1m;
log_format codex_stats_safe '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 192.168.32.125:28443 ssl;
    server_name 79.134.223.90;
    ssl_certificate /etc/letsencrypt/live/nextcloud-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextcloud-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    gzip off;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn codex_stats_connections 10;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=codex_stats_requests burst=30 nodelay;
    access_log /var/log/nginx/codex-stats-access.log codex_stats_safe;
    error_log /var/log/nginx/codex-stats-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Codex-Public 1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    proxy_buffering off;

    location = /_codex_auth {
        internal;
        proxy_pass http://127.0.0.1:8765/api/v1/public-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Codex-Public 1;
    }
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/v1/enroll {
        limit_except POST { deny all; }
        limit_req zone=codex_stats_enrollment burst=3 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/v1/events {
        limit_except POST { deny all; }
        auth_request /_codex_auth;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/v1/agent/checkin {
        limit_except POST { deny all; }
        auth_request /_codex_auth;
        proxy_pass http://127.0.0.1:8765;
    }
    location / { return 404; }
}
